<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReplyInPublic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --fg: #1a1916; --card: #fff; --muted: #f4f3f1; --muted-fg: #6b675e;
  --border: #e7e5e4; --accent: #f3eefe; --stamp: #6d28d9; --stamp-soft: #f3eefe;
  --replied: #2a6b4a; --replied-soft: #e7f4ee; --amber: #a6681b; --amber-soft: #f8edd9;
  --buyer: #3b6fa0; --buyer-soft: #e7f0f8; --side: #fbfafc; --primary: #6d28d9; --on-primary: #fff;
  --radius: 12px;
  color-scheme: light;
}
html.dark {
  --bg: #141210; --fg: #e8e4dc; --card: #1c1a17; --muted: #2a2724; --muted-fg: #b3ada3;
  --border: #3a3632; --accent: #2a2438; --stamp: #c4b5fd; --stamp-soft: #2e2640;
  --replied: #86efac; --replied-soft: #163024; --amber: #fbbf24; --amber-soft: #3a2e14;
  --buyer: #93c5fd; --buyer-soft: #1a2740; --side: #100e0c; --primary: #c4b5fd; --on-primary: #141210;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 14px/1.45 Geist, system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.app { display: flex; height: 100dvh; overflow: hidden; }
.side { width: 220px; flex: none; border-right: 1px solid var(--border); background: var(--side); display: flex; flex-direction: column; gap: 12px; padding: 12px; overflow: auto; }
.logo { display: flex; align-items: center; padding: 4px 8px 8px; font-size: 18px; font-weight: 500; letter-spacing: -0.03em; }
.logo svg { height: 0.9em; width: auto; color: var(--primary); margin-right: 2px; }
.navbtn { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 6px; padding: 4px 8px; text-align: left; color: var(--muted-fg); }
.navbtn.on { background: var(--accent); color: var(--fg); font-weight: 500; }
.navbtn:hover { background: color-mix(in srgb, var(--accent) 70%, transparent); color: var(--fg); }
.navbtn .count { margin-left: auto; font: 12px "IBM Plex Mono", monospace; }
.navbtn .count.hot { background: var(--stamp); color: var(--on-primary); border-radius: 4px; padding: 0 6px; }
.rule { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }
.lab { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-fg); margin: 8px 0 4px; }
.side select, .search input, textarea, .who input { width: 100%; border: 1px solid var(--border); background: var(--card); border-radius: 6px; padding: 6px 8px; }
.foot { margin-top: auto; border-top: 1px solid var(--border); padding-top: 10px; }
.who { display: flex; gap: 8px; align-items: center; width: 100%; border: 0; background: transparent; text-align: left; padding: 6px; border-radius: 8px; }
.avatar { width: 32px; height: 32px; border-radius: 999px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 12px; flex: none; }
.who small { display: block; color: var(--muted-fg); font-size: 10px; }
.avail { color: var(--replied); font-size: 10px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bar { display: flex; justify-content: flex-end; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); padding: 6px 16px; color: var(--muted-fg); font-size: 12px; }
.work { flex: 1; min-height: 0; display: flex; }
.list { width: 380px; flex: none; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.list header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.03em; background: linear-gradient(90deg, var(--fg), var(--stamp)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.headrow { display: flex; justify-content: space-between; align-items: baseline; }
.n { font: 12px "IBM Plex Mono", monospace; color: var(--muted-fg); }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; margin-top: 8px; background: var(--card); }
.search input { border: 0; padding: 6px 0; }
ul.msgs { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
.msg { display: flex; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; background: transparent; text-align: left; padding: 10px 12px; }
.msg.on { border-left-color: var(--stamp); background: color-mix(in srgb, var(--accent) 80%, transparent); }
.msg:hover { background: color-mix(in srgb, var(--accent) 50%, transparent); }
.idx { width: 24px; text-align: right; font: 12px "IBM Plex Mono", monospace; color: var(--muted-fg); padding-top: 2px; }
.meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-fg); }
.meta .brand { margin-left: auto; font-weight: 500; color: var(--fg); }
.badge { border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
.badge.complaint { border-color: color-mix(in srgb, var(--stamp) 40%, var(--border)); color: var(--stamp); }
.badge.buyer { border-color: color-mix(in srgb, var(--buyer) 40%, var(--border)); color: var(--buyer); background: var(--buyer-soft); }
.tag { border-radius: 999px; padding: 0 6px; font-size: 10px; font-weight: 500; }
.tag.stamp { background: var(--stamp-soft); color: var(--stamp); }
.tag.replied { background: var(--replied-soft); color: var(--replied); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tag.muted { background: var(--muted); color: var(--muted-fg); }
.surf { border-radius: 4px; padding: 0 4px; background: var(--muted); }
.surf.earned { background: var(--buyer-soft); color: var(--buyer); }
.clip { margin: 4px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; }
.reader { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow: auto; padding: 24px 40px; }
.sheet { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }
.card { border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 1px 2px color-mix(in srgb, var(--fg) 8%, transparent); }
.card h2 { margin: 0 0 10px; font-size: 22px; letter-spacing: -0.03em; }
.message { font-size: 18px; line-height: 1.55; margin: 0; white-space: pre-wrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--border); padding: 12px 40px; background: color-mix(in srgb, var(--bg) 95%, transparent); }
.btn { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 7px 12px; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
kbd { font: 11px "IBM Plex Mono", monospace; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: 0.7; }
.empty { height: 100%; display: grid; place-items: center; color: var(--muted-fg); font-size: 20px; font-weight: 600; letter-spacing: -0.03em; }
.wide { flex: 1; overflow: auto; padding: 24px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
th { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-fg); }
textarea.draft { min-height: 90px; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 10px; padding: 8px 14px; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
.toast.on { opacity: 1; }
@media (min-width: 861px) { .back { display: none; } }
@media (max-width: 860px) {
  .side { display: none; }
  .list { width: 100%; }
  .reader { display: none; }
  .app.reading .list { display: none; }
  .app.reading .reader { display: flex; position: fixed; inset: 0; background: var(--bg); z-index: 5; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="bar"><span id="updated">Loading</span><button class="btn" id="refresh" type="button">Refresh</button></div>
    <div class="work" id="work"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  const KEY = "replyinpublic.desk2";
  let mem = { status: {}, name: "You", role: "Workspace" };
  try { Object.assign(mem, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => localStorage.setItem(KEY, JSON.stringify(mem));
  const params = new URLSearchParams(location.search);
  if (params.get("token")) sessionStorage.setItem("rip_copilot_token", params.get("token"));
  const token = () => sessionStorage.getItem("rip_copilot_token") || "";
  const $ = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);

  };
  const put = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter(k => k != null && k !== false && k !== ""));
  let messages = [], brands = [], loadedAt = Date.now();
  let S = { view: "inbox", where: "all", brand: "", platform: "", q: "" };
  let sel = null;
  const VIEWS = [["inbox","Inbox"],["parked","Parked for reply"],["snoozed","Snoozed"],["handled","Handled"],["feedback","Feedback for brand"]];
  const OVER = [["clients","Clients"],["kit","Brand kit"]];
  const stateOf = m => mem.status[m.id] && mem.status[m.id].status || "inbox";
  const ageH = m => m.posted_at ? Math.max(0, (Date.now() - Date.parse(m.posted_at)) / 36e5) : 0;
  const rel = m => { const h = Math.floor(ageH(m)); return h < 1 ? "just now" : h < 48 ? h + "h ago" : Math.floor(h / 24) + "d ago"; };
  const surface = m => m.surface === "own" ? "owned" : "earned";
  const toast = t => { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1800); };
  const logo = () => {
    const el = $("div", { class: "logo", text: "ReplyInPublic" });
    el.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 52 40" aria-hidden="true"><path d="M6 9 A16 16 0 0 0 6 31" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M13 13.5 A10 10 0 0 0 13 26.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="34" cy="20" r="14.5" fill="none" stroke="currentColor" stroke-width="5"/></svg>');
    return el;
  };

  function pool() {
    return messages.filter(m => {
      if (S.brand && m.brand_id !== S.brand) return false;
      if (S.platform && m.platform !== S.platform) return false;
      if (S.where === "owned" && surface(m) !== "owned") return false;
      if (S.where === "earned" && surface(m) !== "earned") return false;
      if (S.q && !(m.text + " " + (m.author || "")).toLowerCase().includes(S.q.toLowerCase())) return false;
      return true;
    });
  }
  function inView() {
    const ms = pool();
    if (!VIEWS.some(v => v[0] === S.view)) return ms;
    return ms.filter(m => stateOf(m) === S.view && (S.view !== "inbox" || m.brand_replied !== true));
  }
  function counts() {
    const c = { inbox: 0, parked: 0, snoozed: 0, handled: 0, feedback: 0 };
    for (const m of messages) {
      const st = stateOf(m);
      if (st === "inbox" && m.brand_replied === true) continue;
      if (c[st] != null) c[st] += 1;
    }
    return c;
  }
  function replyTag(m) {
    if (m.brand_replied === true) return $("span", { class: "tag replied", text: "Replied" });
    if (m.brand_replied == null) return $("span", { class: "tag amber", text: "Not confirmed" });
    if (ageH(m) >= 48) return $("span", { class: "tag stamp", text: "No reply" });
    return $("span", { class: "tag muted", text: "Awaiting" });
  }
  function side() {
    const c = counts();
    const nav = (id, label, hot) => $("button", { class: "navbtn" + (S.view === id ? " on" : ""), type: "button", onclick: () => { S.view = id; sel = null; render(); } },
      $("span", { text: label }), c[id] ? $("span", { class: "count" + (hot ? " hot" : ""), text: c[id] }) : null);
    const select = (key, label, options) => {
      const el = $("select", { onchange: e => { S[key] = e.target.value; render(); } });
      for (const [value, text] of options) {
        const opt = $("option", { value, text });
        if (S[key] === value) opt.selected = true;
        el.append(opt);
      }
      return $("div", {}, $("div", { class: "lab", text: label }), el);
    };
    put(document.getElementById("side"),
      logo(),
      $("div", {}, VIEWS.map(([id, label]) => nav(id, label, id === "inbox"))),
      $("hr", { class: "rule" }),
      $("div", {}, OVER.map(([id, label]) => nav(id, label))),
      select("where", "Where", [["all","Everywhere"],["owned","Brand's own posts"],["earned","Other people's posts"]]),
      select("brand", "Client", [["", "All clients"], ...brands.map(b => [b.id, b.name])]),
      select("platform", "Platform", [["","All platforms"],["youtube","YouTube"],["instagram","Instagram"],["tiktok","TikTok"],["x","X"],["reddit","Reddit"]]),
      $("div", { class: "foot" },
        $("button", { class: "who", type: "button", onclick: editWho },
          $("span", { class: "avatar", text: (mem.name || "Y").slice(0, 1).toUpperCase() }),
          $("span", {}, $("b", { text: mem.name }), $("small", { text: mem.role }), $("span", { class: "avail", text: "Available" }))),
        $("button", { class: "navbtn", type: "button", onclick: () => { document.documentElement.classList.toggle("dark"); } }, "Light / dark"))
    );
  }
  function editWho() {
    const name = prompt("Name on this workspace", mem.name);
    if (name == null) return;
    const role = prompt("Role", mem.role);
    if (role == null) return;
    mem.name = name.trim() || "You";
    mem.role = role.trim() || "Workspace";
    save();
    render();
  }
  function list() {
    const items = inView();
    const titles = Object.fromEntries([...VIEWS, ...OVER]);
    const buttons = items.map((m, i) => $("li", {}, $("button", { class: "msg" + (sel === m.id ? " on" : ""), type: "button", onclick: () => { sel = m.id; document.getElementById("app").classList.add("reading"); render(); } },
      $("span", { class: "idx", text: i + 1 }),
      $("div", {},
        $("div", { class: "meta" },
          $("span", { class: "badge " + (m.type === "complaint" ? "complaint" : m.type === "purchase_intent" ? "buyer" : ""), text: m.type === "purchase_intent" ? "buyer" : (m.type || "comment") }),
          $("span", { class: "brand", text: m.brand }),
          $("span", { text: m.platform }),
          $("span", { class: "surf" + (surface(m) === "earned" ? " earned" : ""), text: surface(m) })),
        $("p", { class: "clip", text: m.text }),
        $("div", { class: "meta" }, $("span", { class: "n", text: rel(m) }), replyTag(m), m.type === "purchase_intent" && m.brand_replied !== true ? $("span", { class: "tag", style: "background:var(--buyer-soft);color:var(--buyer)", text: "Buyer waiting" }) : null)
      ))));
    return $("section", { class: "list" },
      $("header", {},
        $("div", { class: "headrow" }, $("h1", { text: titles[S.view] || "Inbox" }), $("span", { class: "n", text: items.length })),
        $("label", { class: "search" }, $("input", { type: "search", placeholder: "Search messages...", value: S.q, oninput: e => { S.q = e.target.value; render(); } }))),
      $("ul", { class: "msgs" }, buttons.length ? buttons : $("li", { class: "empty", style: "height:auto;padding:32px", text: S.view === "inbox" ? "Inbox clear." : "No messages" }))
    );
  }
  function reader() {
    const m = messages.find(x => x.id === sel) || (window.innerWidth > 860 ? inView()[0] : null);
    if (m && sel == null && window.innerWidth > 860) sel = m.id;
    const current = messages.find(x => x.id === sel);
    if (!current) return $("section", { class: "reader" }, $("div", { class: "empty", text: "Pick a message to read." }));
    const where = surface(current) === "owned" ? "on their own post" : "on someone else's post";
    const box = $("div", { id: "draftBox" });
    if (current.draft_text) box.append(draftBox(current, current.draft_text));
    return $("section", { class: "reader" },
      $("div", { class: "scroll" }, $("div", { class: "sheet" },
        $("button", { class: "btn back", type: "button", style: "justify-self:start", onclick: () => document.getElementById("app").classList.remove("reading") }, "Back"),
        $("div", { class: "card" },
          $("h2", { text: "Thread context" }),
          $("div", {}, $("b", { text: current.brand }), " · ", current.platform, " · ", where),
          $("div", { class: "n", style: "margin-top:6px" }, "@" + (current.author || "unknown"), " · ", rel(current), " · ", current.case_id || ""),
          $("div", { style: "margin-top:8px;display:flex;gap:8px;flex-wrap:wrap" },
            $("span", { class: "badge " + (current.type === "complaint" ? "complaint" : ""), text: current.type || "comment" }),
            replyTag(current),
            current.url ? $("a", { href: current.url, target: "_blank", rel: "noopener", text: "Original post" }) : null)),
        $("p", { class: "message", text: current.text }),
        current.reply_text ? $("p", { text: current.brand + " replied: " + current.reply_text }) : null,
        $("div", { class: "card" },
          $("h2", { text: "Suggested reply" }),
          $("p", { class: "n", text: current.support_contact || "Support contact not set." }),
          $("div", { style: "display:flex;gap:8px;margin:8px 0" },
            $("button", { class: "btn primary", type: "button", onclick: () => draft(current) }, "Draft from support pages")),
          box)
      )),
      $("div", { class: "actions" },
        $("button", { class: "btn primary", type: "button", onclick: () => move(current, "handled") }, "Mark handled ", $("kbd", { text: "e" })),
        $("button", { class: "btn", type: "button", onclick: () => move(current, "parked") }, "Park for reply ", $("kbd", { text: "p" })),
        $("button", { class: "btn", type: "button", onclick: () => move(current, "snoozed") }, "Snooze 24h ", $("kbd", { text: "s" })),
        $("button", { class: "btn", type: "button", onclick: () => move(current, "feedback") }, "Feedback for brand ", $("kbd", { text: "f" })),
        stateOf(current) !== "inbox" ? $("button", { class: "btn", type: "button", onclick: () => move(current, "inbox") }, "Back to inbox") : null)
    );
  }
  function draftBox(m, text) {
    const area = $("textarea", { class: "draft" });
    area.value = text;
    return $("div", {}, area, $("div", { style: "display:flex;gap:8px;margin-top:8px" },
      $("button", { class: "btn primary", type: "button", onclick: () => saveDraft(m, "approve", area.value) }, "Approve"),
      $("button", { class: "btn", type: "button", onclick: () => navigator.clipboard.writeText(area.value).then(() => toast("Copied")) }, "Copy")));
  }
  async function draft(m) {
    const box = document.getElementById("draftBox");
    box.textContent = "Reading the support pages.";
    const q = new URLSearchParams({ mention_id: m.id, posted_at: m.posted_at });
    if (token()) q.set("token", token());
    const data = await fetch("/api/copilot?" + q).then(r => r.json());
    box.replaceChildren(draftBox(m, data.reply || ""));
  }
  async function saveDraft(m, action, text) {
    const q = new URLSearchParams();
    if (token()) q.set("token", token());
    const res = await fetch("/api/draft?" + q, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mention_id: m.id, posted_at: m.posted_at, action, final_text: text }) });
    toast(res.ok ? "Approved and queued." : "Open the desk with the copilot token to save a draft.");
  }
  function move(m, status) {
    mem.status[m.id] = { status, at: Date.now() };
    save();
    sel = null;
    toast({ handled: "Marked handled", parked: "Parked for reply", snoozed: "Snoozed for 24h", feedback: "Moved to feedback for brand", inbox: "Moved to inbox" }[status]);
    render();
  }
  function overview() {
    if (S.view === "clients") {
      const rows = brands.map(b => $("tr", {}, $("td", {}, $("button", { class: "btn", type: "button", onclick: () => { S.brand = b.id; S.view = "inbox"; render(); }, text: b.name })), $("td", { text: b.unanswered_14d || 0 }), $("td", { text: b.support_contact || "Not set" }), $("td", { text: (b.kb_chunks || 0) + " passages" })));
      return $("div", { class: "wide" }, $("h1", { text: "Clients" }), $("table", {}, $("thead", {}, $("tr", {}, $("th", { text: "Client" }), $("th", { text: "Open, 14 days" }), $("th", { text: "Support contact" }), $("th", { text: "Pages" }))), $("tbody", {}, rows)));
    }
    const rows = brands.filter(b => b.focus || b.kb_chunks).map(b => $("tr", {}, $("td", { text: b.name }), $("td", { text: b.kb_chunks ? b.kb_chunks + " passages loaded" : "No public pages loaded yet" }), $("td", { text: b.support_contact || "" })));
    return $("div", { class: "wide" }, $("h1", { text: "Brand kit" }), $("p", { class: "n", text: "Drafts use only these public warranty and FAQ pages." }), $("table", {}, $("tbody", {}, rows)));
  }
  function render() {
    side();
    const work = document.getElementById("work");
    const mins = Math.max(0, Math.floor((Date.now() - loadedAt) / 60000));
    document.getElementById("updated").textContent = "Updated " + mins + " min ago";
    if (S.view === "clients" || S.view === "kit") put(work, overview());
    else put(work, list(), reader());
  }
  async function load() {
    const [preview, workspace] = await Promise.all([
      fetch("/api/preview?unanswered=1&actionable=1").then(r => r.json()),
      fetch("/api/workspace").then(r => r.json()),
    ]);
    const kb = {};
    for (const b of workspace.brands || []) kb[b.id] = b;
    brands = (preview.brands || []).map(b => Object.assign({}, b, kb[b.id] || {}));
    messages = preview.comments || [];
    loadedAt = Date.now();
    render();
  }
  document.getElementById("refresh").onclick = load;
  load();
})();
</script>
</body>
</html>
