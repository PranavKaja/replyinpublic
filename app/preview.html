<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReplyInPublic</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #e4dccd;
      --paper: #f7f3ec;
      --card: #fffdf8;
      --red: #9c3418;
      --green: #1f6b45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.45 Georgia, "Iowan Old Style", serif;
    }
    header, main { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }
    header { padding-bottom: 0; }
    h1 { font-size: 34px; font-weight: 500; margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0; }
    .stats { margin: 14px 0 0; color: var(--muted); font-family: ui-sans-serif, sans-serif; font-size: 13px; }
    .days { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .day { display: flex; align-items: center; gap: 6px; font: 12px ui-sans-serif, sans-serif; color: var(--muted); }
    .day span:first-child { display: inline-block; height: 8px; background: #9c3418; }
    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 22px; }
    button {
      display: flex; justify-content: space-between; width: 100%;
      margin: 0 0 6px; padding: 10px 12px; border: 1px solid var(--line);
      background: var(--card); color: var(--ink); text-align: left;
      font: 14px/1.3 ui-sans-serif, sans-serif; cursor: pointer;
    }
    button.on { border-color: var(--ink); }
    .count { color: var(--red); }
    article {
      background: var(--card); border: 1px solid var(--line);
      padding: 14px 16px; margin: 0 0 10px;
    }
    .meta { font: 12px/1.3 ui-sans-serif, sans-serif; color: var(--muted); margin-bottom: 6px; }
    .unanswered { color: var(--red); }
    .replied { color: var(--green); }
    p { margin: 0; white-space: pre-wrap; }
    a { color: var(--ink); }
    .reply { margin-top: 8px; color: var(--green); font-size: 15px; }
    #copilot { margin-top: 12px; padding: 14px; border: 1px solid var(--ink); background: var(--card); }
    #copilot article { margin-top: 10px; }
  .case { font: 12px ui-sans-serif, sans-serif; color: var(--muted); margin-bottom: 8px; }
  .draft-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .draft-actions button { width: auto; margin: 0; padding: 6px 12px; font-size: 12px; }
  #draft-edit { width: 100%; margin-top: 8px; font: 14px/1.4 ui-sans-serif, sans-serif; padding: 8px; border: 1px solid var(--line); }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>ReplyInPublic</h1>
    <p class="sub">Public comments brands have not answered.</p>
    <p class="stats" id="stats">Loading comments from Tiger.</p>
    <p class="stats" id="segments"></p>
    <div class="days" id="days"></div>
    <div style="margin-top: 14px; display: flex; gap: 10px; align-items: center;">
      <button id="toggle-ingest" style="width: auto; margin: 0; padding: 6px 14px; background: #fff; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 13px;">📥 Ingest Grok / X Posts</button>
    </div>
    <div id="ingest-panel" style="display: none; margin-top: 12px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 4px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-weight: bold; font-size: 14px; font-family: ui-sans-serif, sans-serif;">🤖 Grok Live Scraper Prompt</span>
        <button id="copy-prompt-btn" style="width: auto; margin: 0; padding: 4px 10px; font-size: 12px;">📋 Copy Grok Prompt</button>
      </div>
      <p style="font-size: 12px; color: var(--muted); font-family: ui-sans-serif, sans-serif; margin-bottom: 10px;">
        Paste this prompt into Grok on <a href="https://x.com/grok" target="_blank">x.com/grok</a>. Then paste its output below to ingest directly into Tiger Data:
      </p>
      <textarea id="ingest-textarea" rows="4" placeholder="Paste Grok's raw JSON lines here..." style="width: 100%; font-family: ui-monospace, monospace; font-size: 12px; padding: 8px; border: 1px solid var(--line); box-sizing: border-box; resize: vertical;"></textarea>
      <div style="margin-top: 8px; display: flex; gap: 8px; align-items: center;">
        <button id="submit-ingest-btn" style="width: auto; margin: 0; padding: 6px 14px; background: var(--ink); color: #fff; border: none; font-size: 13px;">Submit to Database</button>
        <span id="ingest-status" style="font-size: 13px; color: var(--muted); font-family: ui-sans-serif, sans-serif;"></span>
      </div>
    </div>
  </header>
  <main class="layout">
    <nav id="brands"></nav>
    <section>
      <div id="copilot" hidden></div>
      <div id="comments"></div>
    </section>
  </main>
  <script>
    let selected = "";
    function esc(node, text) { node.textContent = text || ""; }
    async function load() {
      const query = new URLSearchParams({ brand: selected, unanswered: "1" });
      const data = await fetch("/api/preview?" + query).then((r) => r.json());
      const stats = document.getElementById("stats");
      stats.textContent = data.visible + " shown after noise is removed. " + data.total + " stored. Focus: " + data.brands.filter((brand) => brand.focus).map((brand) => brand.name).join(", ") + ".";
      const seg = document.getElementById("segments");
      seg.textContent = data.segments.map((item) => item.type + " " + item.count).join(" · ");
      const days = document.getElementById("days");
      const max = Math.max(1, ...data.days.map((item) => item.count));
      days.replaceChildren();
      for (const item of data.days) {
        const row = document.createElement("div");
        row.className = "day";
        const bar = document.createElement("span");
        bar.style.width = Math.max(4, Math.round(item.count / max * 120)) + "px";
        const label = document.createElement("span");
        label.textContent = item.day + " " + item.count;
        row.append(bar, label);
        days.appendChild(row);
      }
      const nav = document.getElementById("brands");
      nav.replaceChildren();
      const all = document.createElement("button");
      all.className = selected ? "" : "on";
      all.textContent = "Focus five";
      all.onclick = () => { selected = ""; load(); };
      nav.appendChild(all);
      for (const brand of data.brands) {
        const button = document.createElement("button");
        button.className = brand.id === selected ? "on" : "";
        const name = document.createElement("span");
        esc(name, brand.name);
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = brand.unanswered_14d;
        button.append(name, count);
        button.onclick = () => { selected = brand.id; load(); };
        nav.appendChild(button);
      }
      const list = document.getElementById("comments");
      list.replaceChildren();
      if (!data.comments.length) {
        const empty = document.createElement("p");
        empty.className = "sub";
        empty.textContent = "No unanswered comments in this view.";
        list.appendChild(empty);
      }
      for (const comment of data.comments) {
        const card = document.createElement("article");
        const meta = document.createElement("div");
        meta.className = "meta";
        const when = comment.posted_at.replace("T", " ").slice(0, 16);
        const state = comment.brand_replied === false ? "unanswered" : (comment.brand_replied ? "replied" : "unknown");
        const caseBit = comment.case_id ? " · " + comment.case_id : "";
        meta.textContent = comment.brand + caseBit + " · " + (comment.platform || "youtube") + " · " + (comment.author || "someone") + " · " + comment.surface + " · " + when + " · ";
        if (comment.reply_due_at && comment.brand_replied === false) {
          const due = document.createElement("span");
          due.textContent = " · reply due " + comment.reply_due_at.replace("T", " ").slice(0, 16);
          meta.appendChild(due);
        }
        const mark = document.createElement("span");
        mark.className = state === "unanswered" ? "unanswered" : (state === "replied" ? "replied" : "");
        mark.textContent = state;
        meta.appendChild(mark);
        const body = document.createElement("p");
        esc(body, comment.text);
        const link = document.createElement("a");
        link.href = comment.url;
        link.target = "_blank";
        link.rel = "noreferrer";
        const plat = comment.platform ? comment.platform.charAt(0).toUpperCase() + comment.platform.slice(1) : "Source";
        link.textContent = "Open on " + plat;
        card.style.cursor = "pointer";
        card.onclick = (event) => {
          if (event.target.closest("a")) return;
          openCopilot(comment);
        };
        card.append(meta, body, link);
        if (comment.reply_text) {
          const reply = document.createElement("p");
          reply.className = "reply";
          esc(reply, "Brand reply: " + comment.reply_text);
          card.appendChild(reply);
        }
        list.appendChild(card);
      }
    }
    (function () {
      const params = new URLSearchParams(location.search);
      const fromUrl = params.get("token");
      if (fromUrl) sessionStorage.setItem("rip_copilot_token", fromUrl);
    })();
    let activeComment = null;
    function openCopilot(comment) {
      activeComment = comment;
      const box = document.getElementById("copilot");
      box.hidden = false;
      box.textContent = "Reading the manuals.";
      const query = new URLSearchParams({
        mention_id: comment.id,
        posted_at: comment.posted_at,
      });
      const copilotToken = sessionStorage.getItem("rip_copilot_token");
      if (copilotToken) query.set("token", copilotToken);
      fetch("/api/copilot?" + query).then((response) => response.json()).then((data) => {
        box.replaceChildren();
        const head = document.createElement("div");
        head.className = "case";
        let line = "";
        if (data.case_id) line += "Case " + data.case_id + ". ";
        if (data.support_contact) line += "Escalate to " + data.support_contact + ".";
        else line += "No named support contact on file yet.";
        head.textContent = line;
        box.appendChild(head);
        const reply = document.createElement("p");
        reply.textContent = data.reply;
        box.appendChild(reply);
        const edit = document.createElement("textarea");
        edit.id = "draft-edit";
        edit.rows = 3;
        edit.value = data.reply;
        box.appendChild(edit);
        const actions = document.createElement("div");
        actions.className = "draft-actions";
        for (const [label, action] of [["Approve draft", "approve"], ["Save edit", "edit"], ["Reject draft", "reject"]]) {
          const btn = document.createElement("button");
          btn.textContent = label;
          btn.onclick = () => submitDraft(action, edit.value);
          actions.appendChild(btn);
        }
        box.appendChild(actions);
        for (const passage of data.passages || []) {
          const block = document.createElement("article");
          const text = document.createElement("p");
          text.textContent = passage.text.slice(0, 500);
          const link = document.createElement("a");
          link.href = passage.source_url;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = passage.source_url;
          block.append(text, link);
          box.appendChild(block);
        }
      }).catch(() => {
        box.textContent = "not in the manuals, send to the brand's support person";
      });
    }
    async function submitDraft(action, finalText) {
      if (!activeComment) return;
      const copilotToken = sessionStorage.getItem("rip_copilot_token");
      const headers = { "Content-Type": "application/json" };
      const query = new URLSearchParams();
      if (copilotToken) query.set("token", copilotToken);
      const response = await fetch("/api/draft?" + query, {
        method: "POST",
        headers,
        body: JSON.stringify({
          mention_id: activeComment.id,
          posted_at: activeComment.posted_at,
          action,
          final_text: finalText,
        }),
      });
      if (response.ok) load();
    }
    const grokPrompt = `Search X for the 15 most recent public customer complaints, product issues, or questions about KitchenAid, Nespresso, Breville, Instant Pot, or Ninja from the last 7 days. Output strictly raw JSON lines (one JSON object per line) with no markdown fences, no explanations. Format each line like:
{"brand_id": "ninja", "platform": "x", "author": "@username", "text": "my blender broke after 2 days", "url": "https://x.com/username/status/1234567890", "posted_at": "2026-11-14T12:00:00Z"}`;

    const toggleBtn = document.getElementById("toggle-ingest");
    const ingestPanel = document.getElementById("ingest-panel");
    if (toggleBtn && ingestPanel) {
      toggleBtn.onclick = () => {
        ingestPanel.style.display = ingestPanel.style.display === "none" ? "block" : "none";
      };
    }

    const copyPromptBtn = document.getElementById("copy-prompt-btn");
    if (copyPromptBtn) {
      copyPromptBtn.onclick = () => {
        navigator.clipboard.writeText(grokPrompt);
        copyPromptBtn.textContent = "✅ Copied!";
        setTimeout(() => { copyPromptBtn.textContent = "📋 Copy Grok Prompt"; }, 2000);
      };
    }

    const submitIngestBtn = document.getElementById("submit-ingest-btn");
    if (submitIngestBtn) {
      submitIngestBtn.onclick = async () => {
        const textarea = document.getElementById("ingest-textarea");
        const statusSpan = document.getElementById("ingest-status");
        const raw = textarea.value.trim();
        if (!raw) {
          statusSpan.textContent = "Please paste data first.";
          return;
        }
        statusSpan.textContent = "Ingesting...";
        const token = sessionStorage.getItem("rip_copilot_token") || "";
        try {
          const res = await fetch("/api/ingest?token=" + encodeURIComponent(token), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ raw: raw })
          });
          const result = await res.json();
          if (res.ok) {
            statusSpan.textContent = `Success! Added: ${result.added}, Duplicates: ${result.duplicates}, Rule-labeled: ${result.rule_labeled}`;
            textarea.value = "";
            load();
          } else {
            statusSpan.textContent = `Error: ${result.detail || "Failed to ingest"}`;
          }
        } catch (err) {
          statusSpan.textContent = "Network error: " + err.message;
        }
      };
    }

    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
